<h1>陪學生溫習嘅學習 app</h1>
<p class="lead">Tio Edu 幫學生做默書、查字典、記筆記同跟進提醒，由家長開戶，學生專用。</p>
<h2>功能</h2>
<ul><li>默書：朗讀同練習</li><li>字典：隨時查字詞</li><li>筆記：整理課堂內容</li><li>提醒：功課同測驗日期</li><li>小組：同同學一齊溫習</li></ul>
<h2>家長可以放心</h2>
<ul><li>家長開戶，再為學生建立子帳戶</li><li>冇廣告，冇追蹤</li><li>AI 功能經伺服器處理，每位學生每日有使用上限</li></ul>
<h2>學習作品</h2>
<p>我哋會將溫習用嘅小作品放喺呢度，手機直接開到。</p>
<a class="card" href="works/"><strong>颱風 溫習目錄</strong>中二中文《颱風》三節溫習：3D 路線、問答挑戰、對錯、配對、填空。<span class="tag">新</span></a>
