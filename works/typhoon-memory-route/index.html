<title>颱風記憶路線</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600&display=swap">
<style>
/* layout: full-bleed 3D stage behind a translucent bottom sheet; one storm-night look in both themes */
:root{
  --bg:#0b161d;
  --ink:#e9f0f2;
  --ink2:#a9bdc6;
  --signal:#f4c24b;
  --rain:#8fb8c9;
  --sheet:rgba(11,22,29,.88);
  --line:rgba(233,240,242,.18);
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:pan-y}
#stage canvas{display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui>*{pointer-events:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand .t{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.1;letter-spacing:.08em}
.brand .s{font-size:12px;color:var(--ink2);letter-spacing:.06em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{font-family:inherit;color:inherit;cursor:pointer}
.chip{background:rgba(11,22,29,.7);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip[aria-pressed="true"]{border-color:var(--signal);color:var(--signal)}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.sheet{width:100%;max-width:560px;margin:0 auto 12px;box-sizing:border-box;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px 16px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-height:46vh;overflow:auto}
.meta{display:flex;align-items:center;gap:10px}
.no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--signal);color:#16110a;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px}
h1{margin:0;font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.2;text-wrap:balance}
.seg{margin-left:auto;font-size:13px;color:var(--ink2);white-space:nowrap}
.hook{margin:8px 0 0;font-size:14px;color:var(--rain)}
.tx{margin:6px 0 0;font-size:15px;line-height:1.8}
.k{color:var(--signal);background:rgba(244,194,75,.14);border-radius:4px;padding:0 3px;font-weight:500}
.hide .k{color:transparent;background:rgba(233,240,242,.24);cursor:pointer;user-select:none}
.hide .k.open{color:var(--signal);background:rgba(244,194,75,.14)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.nav{flex:none;width:44px;height:44px;border-radius:50%;background:transparent;border:1px solid var(--line);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.dots{display:flex;gap:0;flex:1;justify-content:center}
.dot{width:26px;height:36px;background:none;border:0;padding:0;position:relative}
.dot::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.dot.on::after{background:var(--signal);transform:scale(1.5)}
.lt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.lt button{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;text-align:left;min-height:44px}
.lt .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--signal);color:#16110a;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
.lead{margin:0 0 10px;font-size:14px;color:var(--ink2)}
.no3d-msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:14px;padding:24px;text-align:center}
@media (min-width:700px){.sheet{max-height:none}}
</style>

<div id="stage"></div>
<div class="ui">
  <header class="top">
    <div class="brand"><span class="t">颱風</span><span class="s">內容分析 · 記憶路線</span></div>
    <div class="chips">
      <button class="chip" id="quiz" aria-pressed="false">遮住答案</button>
      <button class="chip" id="ov">全覽</button>
    </div>
  </header>
  <section class="sheet" id="sheet" aria-live="polite">
    <div id="detail">
      <div class="meta"><span class="no" id="no">1</span><h1 id="nm"></h1><span class="seg" id="sg"></span></div>
      <p class="hook" id="hk"></p>
      <p class="tx" id="tx"></p>
    </div>
    <div id="list" hidden>
      <p class="lead">八個地點，跟着作者由樓下行到大街。點一站就會飛過去。</p>
      <ul class="lt" id="lt"></ul>
    </div>
    <div class="ctl" id="ctl">
      <button class="nav" id="prev" aria-label="上一站">‹</button>
      <div class="dots" id="dots"></div>
      <button class="nav" id="next" aria-label="下一站">›</button>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var STOPS=[
 {name:'居所樓下',seg:'第1–3段',hook:'口訣：空街，只有風',html:'街上沒有<span class="k">行人</span>，只有<span class="k">風</span>迎面撲打，雨點刺人。'},
 {name:'鐵絲網旁',seg:'第4段',hook:'口訣：被風吹到企唔穩，躲入鐵閘',html:'作者和朋友與風正面相對，有人被吹得<span class="k">腳步踉蹌</span>，人們要轉進<span class="k">大廈的鐵閘</span>內暫避，有人嘗試走出來又連忙縮回去。'},
 {name:'橫街',seg:'第6段',hook:'口訣：地下髒，頭上危',html:'滿地都是<span class="k">垃圾</span>，頭上有<span class="k">岌岌可危</span>的招牌，上面還掉下<span class="k">碎磚和玻璃片</span>。'},
 {name:'大廈後面',seg:'第6段',hook:'口訣：見海，有欄，風過空地',html:'露出海洋，海洋旁邊有<span class="k">鐵欄</span>，風呼呼地颳過<span class="k">空地</span>。'},
 {name:'馬路',seg:'第8段',hook:'口訣：招牌晃、吊、散白膠片',html:'招牌在風中<span class="k">晃動</span>，有些被吹毀，有些<span class="k">半吊在空中擺動</span>，地上散滿<span class="k">白色膠片</span>。'},
 {name:'公園',seg:'第9段',hook:'口訣：樹葉三種：鮮綠、吹斷、掙扎',html:'樹葉落到街道上，有的<span class="k">鮮嫩青綠、濕漉漉的</span>，有的連枝帶葉被風吹斷，也有樹葉<span class="k">在樹上搖動掙扎</span>。'},
 {name:'碼頭',seg:'第10–12段',hook:'口訣：停開、空籮、樹斷垂地',html:'碼頭關閉，公共汽車<span class="k">停開</span>。海浪洶湧滾動，遠處停泊着大輪船，鐵欄的網上綁着<span class="k">空的竹簍和籮子</span>。附近一株樹<span class="k">被風吹斷</span>，樹葉<span class="k">垂到地面</span>。'},
 {name:'大街',seg:'第13–14段',hook:'口訣：風後一地狼藉，人走出街',html:'紙屑飄飛，地上有<span class="k">橫臥的垃圾筒</span>和<span class="k">破碎的招牌</span>，人們逐漸走到街上。'}
];
var N=STOPS.length, cur=0, ok=false;
function $(id){return document.getElementById(id)}

/* ---------- UI ---------- */
var dotsEl=$('dots'), ltEl=$('lt'), dotBtns=[];
STOPS.forEach(function(s,i){
  var d=document.createElement('button'); d.className='dot'; d.setAttribute('aria-label','第'+(i+1)+'站 '+s.name);
  d.addEventListener('click',function(){go(i)}); dotsEl.appendChild(d); dotBtns.push(d);
  var li=document.createElement('li'), b=document.createElement('button');
  b.innerHTML='<span class="n">'+(i+1)+'</span><span>'+s.name+'</span>';
  b.addEventListener('click',function(){go(i)}); li.appendChild(b); ltEl.appendChild(li);
});
function render(){
  var ov=cur<0;
  $('detail').hidden=ov; $('ctl').hidden=ov; $('list').hidden=!ov;
  $('ov').textContent=ov?'返回':'全覽';
  if(!ov){
    var s=STOPS[cur];
    $('no').textContent=cur+1; $('nm').textContent=s.name; $('sg').textContent=s.seg;
    $('hk').textContent=s.hook; $('tx').innerHTML=s.html;
    dotBtns.forEach(function(d,i){d.classList.toggle('on',i===cur)});
  }
  $('sheet').scrollTop=0;
}
var lastStop=0;
function go(i){ cur=i; if(i>=0) lastStop=i; render(); }
$('prev').addEventListener('click',function(){go((cur+N-1)%N)});
$('next').addEventListener('click',function(){go((cur+1)%N)});
$('ov').addEventListener('click',function(){go(cur<0?lastStop:-1)});
$('quiz').addEventListener('click',function(){
  var on=!document.body.classList.contains('hide');
  document.body.classList.toggle('hide',on);
  this.setAttribute('aria-pressed',on?'true':'false');
  this.textContent=on?'顯示答案':'遮住答案';
  Array.prototype.forEach.call(document.querySelectorAll('.k.open'),function(e){e.classList.remove('open')});
});
$('tx').addEventListener('click',function(e){
  if(document.body.classList.contains('hide')&&e.target.classList.contains('k')) e.target.classList.toggle('open');
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight') go(cur<0?lastStop:(cur+1)%N);
  if(e.key==='ArrowLeft') go(cur<0?lastStop:(cur+N-1)%N);
});
render();

/* ---------- 3D ---------- */
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var renderer,scene,camera,hemi,rain,rainPos,drops=[],labels=[],ovSprites=[],anims=[];
var stage=$('stage');

function M(c){return new THREE.MeshLambertMaterial({color:c})}
function box(w,h,d,c,x,y,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);return m}
function glow(w,h,d,c,x,y,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}));m.position.set(x,y,z);return m}
function cyl(rt,rb,h,c,x,y,z,seg){var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||10),M(c));m.position.set(x,y,z);return m}
function cone(r,h,c,x,y,z){var m=new THREE.Mesh(new THREE.ConeGeometry(r,h,8),new THREE.MeshLambertMaterial({color:c,flatShading:true}));m.position.set(x,y,z);return m}
function sph(r,c,x,y,z){var m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),new THREE.MeshLambertMaterial({color:c,flatShading:true}));m.position.set(x,y,z);return m}
function person(c,x,z){
  var g=new THREE.Group();
  g.add(cyl(0.26,0.32,1,c,0,0.5,0,8));
  g.add(sph(0.24,0xe3c3a0,0,1.25,0));
  g.position.set(x,0,z); return g;
}
function pathPos(i){return new THREE.Vector3(i*16,0,Math.sin(i*0.8)*9)}
function rnd(s){var x=Math.sin(s*127.1)*43758.5453;return x-Math.floor(x)}
function streaks(g,ys,z){
  ys.forEach(function(y,i){
    var m=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.04,0.04),new THREE.MeshBasicMaterial({color:0xcfe3ea,transparent:true,opacity:0.5}));
    m.position.set(0,y,z); g.add(m);
    anims.push(function(t){m.position.x=5-((t*7+i*4.1)%11)});
  });
}

function b1(g){
  g.add(box(3.4,10,3.4,0x34505f,-2.2,5,-1.5));
  for(var r=0;r<8;r++)for(var c=0;c<3;c++){
    var lit=(r*3+c)%4===1;
    g.add(lit?glow(0.55,0.6,0.1,0xf4c24b,-3.3+c*1.1,1.3+r*1.1,0.26):box(0.55,0.6,0.1,0x1b2c36,-3.3+c*1.1,1.3+r*1.1,0.26));
  }
  g.add(box(11,0.04,3.4,0x22343e,0,0.02,3.4));
  g.add(cyl(0.07,0.09,4.6,0x7f98a4,3.4,2.3,1,6));
  g.add(glow(0.4,0.3,0.4,0xf4c24b,3.4,4.7,1));
  streaks(g,[1.2,2.4,3.6],3.4);
}
function b2(g){
  for(var i=0;i<=12;i++) g.add(box(0.08,3.6,0.08,0x7f98a4,-5.2+i*0.5,1.8,2));
  [0.6,1.9,3.4].forEach(function(y){g.add(box(6.1,0.1,0.1,0x7f98a4,-2.2,y,2))});
  g.add(box(4.2,6.5,3,0x34505f,3.2,3.25,-1.5));
  g.add(box(2,3.2,0.2,0x0b161d,3.2,1.6,0.05));
  for(var j=0;j<5;j++) g.add(box(0.06,3.2,0.06,0x9aa9b0,2.4+j*0.4,1.6,0.2));
  var p1=person(0x4f7fa8,-1.5,3.8);
  var p2=person(0xb8573c,1.6,1.4);
  g.add(p1); g.add(p2);
  anims.push(function(t){
    p1.rotation.z=0.35*Math.sin(t*3.1); p1.position.x=-1.5+Math.sin(t*1.7)*0.5;
    p2.position.x=1.6+0.55*Math.sin(t*2);
  });
  streaks(g,[1.5,3],3.2);
}
function b3(g){
  g.add(box(3,9,10,0x2c4452,-5,4.5,0));
  g.add(box(3,9,10,0x2c4452,5,4.5,0));
  g.add(box(7,0.04,10,0x22343e,0,0.02,0));
  var cols=[0x6d7b82,0xcfd6d9,0x8a6f55,0x4f5a60];
  for(var i=0;i<16;i++){
    var m=box(0.2+rnd(i)*0.4,0.15+rnd(i+9)*0.3,0.2+rnd(i+5)*0.4,cols[i%4],(rnd(i+3)-0.5)*5.4,0.12,(rnd(i+7)-0.5)*8);
    m.rotation.y=rnd(i+2)*3; g.add(m);
  }
  var pivot=new THREE.Group(); pivot.position.set(-3.4,6.2,-1);
  pivot.add(box(0.15,0.15,0.15,0x9aa9b0,0,0,0));
  var sign=box(2.2,1.2,0.2,0xb8573c,1.1,-0.6,0); pivot.add(sign);
  g.add(pivot);
  anims.push(function(t){pivot.rotation.z=-0.55+Math.sin(t*3)*0.12});
  var bits=[];
  for(var k=0;k<7;k++){
    var glass=k%2===1;
    var b=glass?new THREE.Mesh(new THREE.BoxGeometry(0.22,0.22,0.04),new THREE.MeshBasicMaterial({color:0xbfe6f2,transparent:true,opacity:0.8})):box(0.3,0.18,0.18,0xa5603f,0,0,0);
    b.position.x=-1.8+(rnd(k)-0.5)*1.6; b.position.z=-1+(rnd(k+4)-0.5)*1.2; g.add(b); bits.push(b);
  }
  anims.push(function(t){bits.forEach(function(b,i){b.position.y=5.6-((t*1.7+i*0.8)%5.4); b.rotation.x=t*3+i; b.rotation.z=t*2+i})});
}
function b4(g){
  var sea=new THREE.Mesh(new THREE.PlaneGeometry(9,4),M(0x1f5a70));
  sea.rotation.x=-Math.PI/2; sea.position.set(0,0.03,-4.3); g.add(sea);
  var waves=[];
  for(var i=0;i<8;i++){var w=box(0.9,0.08,0.16,0xcfe3ea,-3.6+i*1.0,0.08,-4.8+rnd(i)*1.8); g.add(w); waves.push(w)}
  anims.push(function(t){waves.forEach(function(w,i){w.position.y=0.08+Math.abs(Math.sin(t*2+i))*0.18})});
  for(var p=0;p<9;p++) g.add(box(0.1,1.5,0.1,0x9aa9b0,-4+p*1,0.75,-2.6));
  g.add(box(8.2,0.1,0.1,0x9aa9b0,0,1.4,-2.6));
  g.add(box(8.2,0.1,0.1,0x9aa9b0,0,0.8,-2.6));
  g.add(box(3.4,6.4,3.2,0x34505f,3.4,3.2,1.6));
  g.add(box(3.4,0.2,3.2,0x1f3039,3.4,6.5,1.6));
  streaks(g,[0.9,1.9,2.9],2.2);
}
function b5(g){
  g.add(box(11,0.1,4.6,0x1d2a31,0,0.05,1));
  for(var d=-4;d<=4;d+=2) g.add(box(1,0.02,0.15,0xd8d8c8,d,0.11,1));
  var cs=[0xb8573c,0x3f7aa8,0xc9a23a], xs=[-3.6,0,3.6], piv=[];
  xs.forEach(function(x,i){
    g.add(cyl(0.07,0.09,4.4,0x7f98a4,x,2.2,-2,6));
    var p=new THREE.Group(); p.position.set(x,4.3,-2);
    p.add(box(1.6,0.9,0.12,cs[i],0,-0.55,0));
    g.add(p); piv.push(p);
  });
  var bits=[];
  for(var k=0;k<12;k++){var b=box(0.5,0.03,0.3,0xf3f3ee,0,0.14,0); b.position.x=-5+rnd(k)*10; b.position.z=-0.8+rnd(k+3)*3.6; g.add(b); bits.push(b)}
  anims.push(function(t){
    piv[0].rotation.z=Math.sin(t*3)*0.55;
    piv[1].rotation.z=Math.sin(t*3+1.7)*0.5;
    piv[2].rotation.z=1.05+Math.sin(t*4)*0.1;
    bits.forEach(function(b,i){b.position.x=5-((t*2.5+i*0.9)%10.5); b.rotation.y=t*2+i});
  });
}
function tree(g,x,z,s){
  var t=new THREE.Group(); t.position.set(x,0,z);
  t.add(cyl(0.18*s,0.26*s,1.6*s,0x6b4f35,0,0.8*s,0,6));
  t.add(cone(1.3*s,2.4*s,0x3f7d4a,0,2.4*s,0));
  t.add(cone(1*s,2*s,0x4c9156,0,3.5*s,0));
  g.add(t); return t;
}
function b6(g){
  var ts=[[-4,-2,1],[-1.5,-3.6,1.2],[2,-2.6,1.1],[4.2,-0.4,0.9],[-3.9,1.6,0.9]], trees=[];
  ts.forEach(function(a){trees.push(tree(g,a[0],a[1],a[2]))});
  var br=box(2.2,0.18,0.18,0x6b4f35,-0.6,0.12,3.3); br.rotation.y=0.5; g.add(br);
  g.add(sph(0.6,0x4c9156,-1.5,0.4,3.7)); g.add(sph(0.45,0x3f7d4a,-0.9,0.3,3.1));
  var stump=cyl(0.2,0.27,1.1,0x6b4f35,1,0.55,2.2,6); g.add(stump);
  var lv=[];
  for(var i=0;i<16;i++){
    var l=new THREE.Mesh(new THREE.PlaneGeometry(0.28,0.38),new THREE.MeshBasicMaterial({color:0x7ccf6f,side:THREE.DoubleSide}));
    l.position.set((rnd(i)-0.5)*9,0,(rnd(i+5)-0.5)*7); g.add(l); lv.push(l);
  }
  anims.push(function(t){
    trees.forEach(function(tr,i){tr.rotation.z=Math.sin(t*2.6+i*1.3)*0.09; tr.rotation.x=Math.sin(t*2.1+i)*0.05});
    lv.forEach(function(l,i){var ph=(t*0.9+i*0.37)%6; l.position.y=6-ph; l.rotation.x=t*3+i; l.rotation.z=t*2+i; l.position.x+=Math.sin(t*2+i)*0.01});
  });
}
function b7(g){
  var sea=new THREE.Mesh(new THREE.CircleGeometry(6.3,36),M(0x1f4a5c)); sea.rotation.x=-Math.PI/2; sea.position.y=0.02; g.add(sea);
  var ws=[];

function makeLabel(text){
  var c=document.createElement('canvas'); c.width=512; c.height=128;
  var tex=new THREE.CanvasTexture(c);
  function draw(){
    var x=c.getContext('2d'); x.clearRect(0,0,512,128);
    x.fillStyle='rgba(11,22,29,0.82)'; x.fillRect(0,0,512,128);
    x.strokeStyle='#f4c24b'; x.lineWidth=4; x.strokeRect(2,2,508,124);
    x.fillStyle='#f4c24b'; x.font='500 58px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
    x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,256,68);
    tex.needsUpdate=true;
  }
  draw(); labels.push(draw);
  return new THREE.Mesh(new THREE.PlaneGeometry(4.4,1.1),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
}
function makeNumber(n){
  var c=document.createElement('canvas'); c.width=128; c.height=128;
  var x=c.getContext('2d');
  x.fillStyle='#f4c24b'; x.beginPath(); x.arc(64,64,60,0,Math.PI*2); x.fill();
  x.fillStyle='#16110a'; x.font='500 76px "Noto Sans TC",sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(String(n),64,70);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true,fog:false}));
  sp.scale.set(15,15,1); return sp;
}

var camPos=new THREE.Vector3(0,8,18), look=new THREE.Vector3(0,1,0), camUp=new THREE.Vector3(0,1,0);
var gp=new THREE.Vector3(), gl=new THREE.Vector3(), gup=new THREE.Vector3();
var dist=20, flash=0, nextFlash=4, t=0, last=0, fogN=18, fogF=60;

function init(){
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  stage.appendChild(renderer.domElement);
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b161d); scene.fog=new THREE.Fog(0x0b161d,18,60);
  camera=new THREE.PerspectiveCamera(60,1,0.1,500);
  hemi=new THREE.HemisphereLight(0x9fc4d4,0x1a2a33,0.9); scene.add(hemi);
  var dl=new THREE.DirectionalLight(0xffffff,0.6); dl.position.set(-6,14,9); scene.add(dl);
  for(var i=0;i<N;i++){
    var g=new THREE.Group(); g.position.copy(pathPos(i)); scene.add(g);
    var plat=new THREE.Mesh(new THREE.CylinderGeometry(6.4,6.8,0.6,36),M(0x16303c)); plat.position.y=-0.3; g.add(plat);
    BUILD[i](g);
    var lb=makeLabel((i+1)+'  '+STOPS[i].name); lb.position.set(0,0.65,5.7); g.add(lb);
    var ns=makeNumber(i+1); ns.position.set(0,4,0); ns.visible=false; g.add(ns); ovSprites.push(ns);
    if(i<N-1){
      var a=pathPos(i), b=pathPos(i+1);
      for(var k=1;k<=5;k++){
        var p=a.clone().lerp(b,0.22+k*0.11);
        var s=box(1,0.2,1,0x2a4452,p.x,-0.1,p.z); s.rotation.y=k; scene.add(s);
      }
    }
  }
  var cnt=900, pos=new Float32Array(cnt*6);
  for(var d=0;d<cnt;d++) drops.push({x:(Math.random()-0.5)*50,y:Math.random()*22,z:(Math.random()-0.5)*50});
  var geo=new THREE.BufferGeometry(); rainPos=new THREE.BufferAttribute(pos,3); geo.setAttribute('position',rainPos);
  rain=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0x8fb8c9,transparent:true,opacity:0.55}));
  rain.frustumCulled=false; scene.add(rain);
  fit(); window.addEventListener('resize',fit);
  var p0=pathPos(0); camPos.set(p0.x,12,p0.z+30); look.set(p0.x,1,p0.z);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){labels.forEach(function(f){f()})});
  ok=true; requestAnimationFrame(frame);
}
function fit(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h); camera.aspect=w/h;
  camera.setViewOffset(w,h,0,Math.round(h*0.16),w,h);
  var tn=Math.tan(30*Math.PI/180);
  dist=Math.min(30,Math.max(16,6.4/(tn*camera.aspect)));
}
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
  var ov=cur<0;
  if(!ov){
    var p=pathPos(cur);
    gl.set(p.x,1.2,p.z);
    gp.set(p.x+Math.sin(t*0.5)*0.4,dist*0.42+Math.sin(t*0.7)*0.15,p.z+dist*0.9);
    gup.set(0,1,0);
  }else{
    gl.set(56,0,0); gp.set(56,118,14); gup.set(1,0,0);
  }
  var k=1-Math.exp(-dt*2.6);
  camPos.lerp(gp,k); look.lerp(gl,k); camUp.lerp(gup,k).normalize();
  camera.position.copy(camPos); camera.up.copy(camUp); camera.lookAt(look);
  var tn2=ov?400:dist*0.9, tf=ov?900:dist*3.4;
  fogN+=(tn2-fogN)*k; fogF+=(tf-fogF)*k; scene.fog.near=fogN; scene.fog.far=fogF;
  for(var i=0;i<N;i++) ovSprites[i].visible=ov;
  rain.visible=!ov; rain.position.set(look.x,0,look.z);
  var sp=reduce?0.35:1, arr=rainPos.array;
  for(var d=0;d<drops.length;d++){
    var o=drops[d];
    o.y-=26*dt*sp; o.x-=9*dt*sp;
    if(o.y<0){o.y=22; o.x=(Math.random()-0.5)*50; o.z=(Math.random()-0.5)*50}
    if(o.x<-25) o.x+=50;
    var j=d*6;
    arr[j]=o.x; arr[j+1]=o.y; arr[j+2]=o.z; arr[j+3]=o.x+0.4; arr[j+4]=o.y+1.0; arr[j+5]=o.z;
  }
  rainPos.needsUpdate=true;
  for(var a=0;a<anims.length;a++) anims[a](reduce?t*0.4:t);
  if(!reduce){
    nextFlash-=dt;
    if(nextFlash<0){flash=1; nextFlash=7+Math.random()*9}
    flash=Math.max(0,flash-dt*3.2);
    hemi.intensity=0.9+flash*(0.6+Math.random()*0.5);
  }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

var sx=0,sy=0,sdown=false;
stage.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;sdown=true});
stage.addEventListener('pointerup',function(e){
  if(!sdown) return; sdown=false;
  var dx=e.clientX-sx, dy=e.clientY-sy;
  if(cur>=0&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)) go(dx<0?(cur+1)%N:(cur+N-1)%N);
});
stage.addEventListener('pointercancel',function(){sdown=false});

try{ init(); }
catch(e){
  var m=document.createElement('div'); m.className='no3d-msg';
  m.textContent='呢部手機未能顯示 3D 畫面，下面仍然可以逐站溫習。';
  stage.appendChild(m);
}
})();
