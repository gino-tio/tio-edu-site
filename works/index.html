<style>
:root{--bg:#f6f4ee;--ink:#14262e;--ink2:#4d6068;--line:#d9d6cb;--accent:#0f5e6e;--sig:#e0a526;--card:#fffdf8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a20;--ink:#e8eff1;--ink2:#9fb3bb;--line:#26404a;--accent:#7fd0e0;--sig:#f4c24b;--card:#142630;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:0 max(18px,env(safe-area-inset-left)) 48px}
main{max-width:640px;margin:0 auto}

h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:34px;line-height:1.25;margin:40px 0 8px;text-wrap:balance}
h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:21px;margin:36px 0 8px}
p{margin:8px 0;color:var(--ink2)}.lead{font-size:18px;color:var(--ink)}
ul{padding-left:20px;color:var(--ink2)}li{margin:4px 0}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:inherit;text-decoration:none;margin-top:14px}
.card:hover{border-color:var(--accent)}.card strong{display:block;font-size:18px;color:var(--ink)}.tag{display:inline-block;font-size:13px;color:var(--ink);background:var(--sig);border-radius:999px;padding:0 10px;margin-top:6px}

footer{margin-top:48px;font-size:13px;color:var(--ink2)}
