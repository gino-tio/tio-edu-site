<h1>颱風 溫習目錄</h1>
<p class="lead">中二中文《颱風》，按課堂分成三節，每節有唔同嘅溫習遊戲。揀一節開始。</p>
<a class="card" href="typhoon-memory-route/"><strong>一、內容分析</strong>3D 記憶路線，由居所樓下行到大街，仲有 Kahoot 式問答挑戰。<span class="tag">3D</span><span class="tag">問答</span></a>
<a class="card" href="writing-techniques/"><strong>二、寫作手法</strong>步移法、定點描寫、直接同間接描寫、比喻描寫：重點速覽、對錯快答、配對遊戲。<span class="tag">對錯</span><span class="tag">配對</span></a>
<a class="card" href="essay-questions/"><strong>三、增潤篇章提問</strong>三條考試題：答案重點、自己打字填空、選擇題。<span class="tag">寫字</span><span class="tag">選擇題</span></a>
