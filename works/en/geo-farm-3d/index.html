.seg2{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:17px}

<script>
(function(){
var D={"stops": [{"id": "overview", "name": "Farm Island", "seg": "Unit 1-3", "hook": "Tap the numbers to visit each part", "html": "<p>This island is a <span class=\"k\">farming system</span>: physical and cultural inputs go through processes and become outputs.</p><p>Big <b>Farm A</b> is on the left and small <b>Farm B</b> on the right. Drag to turn, pinch to zoom. The picture is not to scale.</p><p>When you are ready, press “Challenge” and tap the answers on the island.</p>"}, {"id": "phys", "name": "Physical inputs", "seg": "Unit 1", "hook": "Sun, temperature, rain, seeds, land, soil", "html": "<p><b>Physical inputs</b> (6 in the textbook):</p><p><span class=\"k\">sunlight</span> · <span class=\"k\">air temperature</span> · <span class=\"k\">rainfall</span> · <span class=\"k\">seeds</span> · <span class=\"k\">land</span> · <span class=\"k\">soil nutrients</span></p><p>The sun, rain cloud, soil and seeds are here. Nature provides them; people do not make them.</p>"}, {"id": "cult", "name": "Cultural inputs", "seg": "Unit 1", "hook": "Capital, fertilizers, pesticides, technology, labour, irrigation, machines", "html": "<p><b>Cultural inputs</b> (7 in the textbook):</p><p><span class=\"k\">capital</span> · <span class=\"k\">fertilizers</span> · <span class=\"k\">pesticides</span> · <span class=\"k\">technology</span> · <span class=\"k\">labour</span> · <span class=\"k\">irrigation system</span> · <span class=\"k\">machines</span></p><p>The tractor, fertilizer bags, sprayer, pump, money bag and farmers are all brought in by people.</p>"}, {"id": "proc", "name": "Processes", "seg": "Unit 1", "hook": "Plough, seed, irrigate, fertilize, weed, harvest", "html": "<p><b>Processes</b>: the work farmers do with the inputs.</p><p><span class=\"k\">ploughing</span> → <span class=\"k\">seeding</span> → <span class=\"k\">irrigating</span> → <span class=\"k\">fertilizing</span> → <span class=\"k\">weeding</span> → <span class=\"k\">harvesting</span></p><p>2024-25 QE: the process shown in both photos = harvesting.</p>"}, {"id": "useful", "name": "Useful outputs and market", "seg": "Unit 1", "hook": "Produce → market → cash → feedback", "html": "<p><b>Useful outputs</b>: <span class=\"k\">crops</span> · <span class=\"k\">meat</span> · <span class=\"k\">milk</span> · <span class=\"k\">wool</span></p><p>Sold at the <b>market</b> for <b>cash</b>. The cash buys more cultural inputs: <span class=\"k\">feedback</span> (the yellow balls flow from the market back to the farm).</p><p><b>Cash crop</b> = grown for sale; <b>subsistence crop</b> = grown for the farmer’s own food.</p>"}, {"id": "useless", "name": "Useless outputs", "seg": "Unit 1", "hook": "Animal waste, crop residues, pollutants", "html": "<p><b>Useless outputs</b>: <span class=\"k\">animal waste</span> · <span class=\"k\">crop residues</span> · <span class=\"k\">pollutants</span></p><p>The manure heap, straw pile and black smoke are here.</p><p>2025-26 UT: the useless output of a dairy farm = animal waste (milk and meat are useful).</p>"}, {"id": "farmB", "name": "Farm B (small farm)", "seg": "Unit 2", "hook": "Intensive · Arable · Subsistence · Low-tech", "html": "<p>6 ha with <b>12</b> farmers, hand labour and a buffalo, growing rice mainly for the family.</p><p><span class=\"k\">Intensive</span> · <span class=\"k\">Arable</span> · <span class=\"k\">Subsistence</span> · <span class=\"k\">Low-technology</span></p><p>Farmers per unit of land = 12 ÷ 6 = <b>2</b> per hectare. Example: rice in Indonesia (harvested by hand).</p>"}, {"id": "farmA", "name": "Farm A (big farm)", "seg": "Unit 2", "hook": "Extensive · Pastoral · Commercial · High-tech", "html": "<p>300 ha with only <b>3</b> farmers, large machines and livestock, mainly for sale.</p><p><span class=\"k\">Extensive</span> · <span class=\"k\">Pastoral</span> · <span class=\"k\">Commercial</span> · <span class=\"k\">High-technology</span></p><p>300 ha × 0.01 = <b>3</b> farmers (X = 3). Examples: dairy farming in New Zealand, wheat in central USA (combine harvester).</p>"}, {"id": "cmp", "name": "Compare the two farms", "seg": "Unit 2", "hook": "Large or small inputs per unit of land?", "html": "<table class=\"tb\"><tr><th></th><th>Farm A</th><th>Farm B</th></tr><tr><td>Inputs per land</td><td>Extensive</td><td>Intensive</td></tr><tr><td>Output</td><td>Pastoral</td><td>Arable</td></tr><tr><td>Use</td><td>Commercial</td><td>Subsistence</td></tr><tr><td>Technology</td><td>High</td><td>Low</td></tr><tr><td>Farm size</td><td>300 ha</td><td>6 ha</td></tr><tr><td>Farmers</td><td>3</td><td>12</td></tr></table><p><span class=\"k\">Farmers per unit of land = number of farmers ÷ farm size</span></p><p>⚠ Upland rice in Laos: textbook Table 4 ticks extensive, but the 2025-26 UT marking scheme says labour input per unit area = High (intensive). Follow the school’s marking scheme.</p>"}], "qs": [["phys", "Tap a <b>physical input</b> (sun, rain, soil, seeds…)"], ["cult", "Tap a <b>cultural input</b> (machine, fertilizer, farmer, pump…)"], ["market", "Where does the farmer sell produce to earn <b>cash</b>?"], ["useful", "Tap a <b>useful output</b> (crops, milk…)"], ["useless", "Tap a <b>useless output</b> (waste, straw, pollution)"], ["farmB", "Which is the <b>intensive</b> farm? (small land, many workers)"], ["farmA", "Which is the <b>extensive</b> farm? (large land, few workers)"], ["proc", "Tap a <b>farming process</b> tool (plough, seeds, watering can, hoe, sickle)"], ["farmA", "Which farm is mainly <b>pastoral</b> (rearing livestock)?"], ["farmB", "Which farm is mainly <b>subsistence</b> (for the family)?"], ["farmA", "Which farm is <b>high-technology</b>?"], ["farmB", "Which farm has <b>12</b> farmers on 6 hectares?"]], "tiles": [["phys", "☀️", "sunlight"], ["phys", "🌡️", "air temperature"], ["phys", "🌧️", "rainfall"], ["phys", "🌱", "seeds"], ["phys", "🟫", "land"], ["phys", "🧱", "soil nutrients"], ["cult", "💰", "capital"], ["cult", "🧪", "fertilizers"], ["cult", "☠️", "pesticides"], ["cult", "💻", "technology"], ["cult", "🧑‍🌾", "labour"], ["cult", "💧", "irrigation system"], ["cult", "🚜", "machines"], ["proc", "⛏️", "ploughing"], ["proc", "🌰", "seeding"], ["proc", "🚿", "irrigating"], ["proc", "🧴", "fertilizing"], ["proc", "🪓", "weeding"], ["proc", "🌾", "harvesting"], ["useful", "🥬", "crops"], ["useful", "🥩", "meat"], ["useful", "🥛", "milk"], ["useful", "🧶", "wool"], ["market", "🏪", "market"], ["useless", "💩", "animal waste"], ["useless", "🌾", "crop residues"], ["useless", "🏭", "pollutants"], ["farmA", "🐄", "Farm A"], ["farmB", "🌾", "Farm B"]], "tgroup": [["phys", "Physical inputs", 1], ["cult", "Cultural inputs", 2], ["proc", "Processes", 3], ["useful", "Useful outputs", 4], ["useless", "Useless outputs", 5], ["farms", "The two farms", 6]], "ui": {"back": "‹ Food Problems", "title": "Farm Island", "sub": "3D revision · Food Problems Units 1-3", "prev": "Previous", "next": "Next", "chal": "Challenge", "to2d": "2D view", "to3d": "3D view", "ovbtn": "Whole island", "cstart": "Farm Island challenge", "chead": "Tap the answers on the island", "crules": ["8 questions: tap the answer on the island (or in the 2D view)", "The timer can be switched on or off", "A wrong answer shows you the right place"], "timer": "Timer", "on": "On", "off": "Off", "go": "Start", "best": "Best score", "secs": "20 seconds per question; faster answers score more", "nosecs": "No time limit", "right": "✔ Correct!", "wrong": "✘ Not quite. You tapped", "nothing": "Nothing there; try again", "timeup": "⏰ Time is up", "shown": "The right place is flashing", "nextq": "Next", "skip": "Skip", "endh": "Challenge complete", "score": "Score", "ok": "Correct", "again": "Play again", "explore": "Back to exploring", "wgl": "3D is not available here, so the 2D view is shown.", "hint2d": "Tap an item to read about it; in the challenge, tap the answer.", "quiz": "Do the quiz ›", "qn": "Question"}, "tagname": {"phys": "a physical input", "cult": "a cultural input", "proc": "a farming process", "useful": "a useful output", "useless": "a useless output", "market": "the market", "farmA": "Farm A", "farmB": "Farm B"}, "lang": "en"},U=D.ui,S=D.stops,N=S.length;
function $(id){return document.getElementById(id)}
function pget(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function pset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsGet(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- static UI text ---------- */
$('back').textContent=U.back; $('ttl').textContent=U.title; $('chal').textContent=U.chal; $('ov').textContent=U.ovbtn; $('qlink').textContent=U.quiz;
$('cskip').textContent=U.skip;
var hasGL=false,THREEok=typeof THREE!=='undefined';
var mode=pget('farmMode','3d');
var cur=0,chalOn=false,challenge=null;
var dotsEl=$('dots'),dotBtns=[];
S.forEach(function(s,i){var d=document.createElement('button');d.className='dot';d.type='button';d.setAttribute('aria-label',s.name);d.addEventListener('click',function(){go(i)});dotsEl.appendChild(d);dotBtns.push(d)});
var sheetH=240;
function render(){
  var s=S[cur];
  $('no').textContent=cur===0?'★':cur; $('nm').textContent=s.name; $('sg').textContent=s.seg; $('hk').textContent=s.hook; $('tx').innerHTML=s.html;
  dotBtns.forEach(function(d,i){d.classList.toggle('on',i===cur)});

  $('sheet').style.display=chalOn?'none':'';
  sheetH=chalOn?0:$('sheet').offsetHeight+14;
  $('v2d').style.paddingBottom=(sheetH+20)+'px';
  $('v2d').style.paddingTop=($('top').offsetHeight+12)+'px';

}
function go(i){cur=((i%N)+N)%N;render();if(hasGL&&mode==='3d')flyTo(cur)}
$('prev').addEventListener('click',function(){go(cur-1)});

document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});

/* ---------- 2D view ---------- */
var tilesEl=$('tiles'),TAGSTOP={phys:1,cult:2,proc:3,useful:4,market:4,useless:5,farmB:6,farmA:7};
var PRIO=['phys','cult','proc','useful','useless','market','farmB','farmA'];
D.tgroup.forEach(function(g){
  var h=document.createElement('h2');h.textContent=g[1];tilesEl.appendChild(h);
  var w=document.createElement('div');w.className='tiles';
  D.tiles.forEach(function(t){
    var grp=(t[0]==='farmA'||t[0]==='farmB')?'farms':(t[0]==='market'?'useful':t[0]);

/* ---------- modes ---------- */
function setMode(m){
  if(m==='3d'&&!hasGL)m='2d';
  mode=m;pset('farmMode',m);
  $('stage').style.display=m==='3d'?'':'none';

/* ---------- challenge ---------- */
var LIM=20;
function timerOn(){return pget('tyTimer','on')!=='off'}
function bkey(){return 'farm3dBest'+(timerOn()?'':'_nt')}
function openCard(html){$('qcard').innerHTML=html;$('qz').hidden=false}

  var on=timerOn();
  openCard('<h2>'+U.cstart+'</h2><p>'+U.chead+'</p><ul>'+U.crules.map(function(r){return '<li>'+r+'</li>'}).join('')+'</ul>'+
   '<div class="seg2"><span>'+U.timer+'</span><button class="chip" type="button" data-t="on" aria-pressed="'+on+'">'+U.on+'</button><button class="chip" type="button" data-t="off" aria-pressed="'+!on+'">'+U.off+'</button></div>'+
   '<p>'+(on?U.secs:U.nosecs)+'</p><p>'+U.best+': <b>'+lsGet(bkey())+'</b></p>'+
   '<button class="big" id="cgo" type="button">'+U.go+'</button><button class="big alt" id="ccx" type="button">'+U.explore+'</button>');
  $('qcard').querySelectorAll('[data-t]').forEach(function(b){b.addEventListener('click',function(){pset('tyTimer',b.getAttribute('data-t'));startCard()})});

function beginChallenge(){
  closeCard();chalOn=true;

  $('chal').textContent=U.explore;$('chbar').hidden=false;$('cbw').style.display=challenge.timer?'':'none';
  fitSheet();go(0);askNext();
}
function askNext(){
  var c=challenge;if(c.i>=c.qs.length){finish();return}
  c.lock=false;c.t0=performance.now();
  $('cn').textContent=U.qn+' '+(c.i+1)+'/'+c.qs.length;$('cs').textContent=U.score+' '+c.score;
  $('cq').innerHTML=c.qs[c.i][1];$('cfb').textContent='';$('cfb').className='fb';fitSheet();
}
function submit(tags){
  var c=challenge;if(!c||c.lock)return;
  var q=c.qs[c.i];
  if(!tags.length){$('cfb').textContent=U.nothing;$('cfb').className='fb bad';return}
  c.lock=true;setTimeout(fitSheet,30);
  if(tags.indexOf(q[0])>=0){

var ptrs={},tap=null,pinch0=0,r0=0;
function bindControls(){
  var el=renderer.domElement;
  el.addEventListener('pointerdown',function(e){
    el.setPointerCapture&&el.setPointerCapture(e.pointerId);
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    tap=Object.keys(ptrs).length===1?{x:e.clientX,y:e.clientY,t:performance.now(),moved:false}:null;
    if(Object.keys(ptrs).length===2){var k=Object.keys(ptrs),a=ptrs[k[0]],b=ptrs[k[1]];pinch0=Math.hypot(a.x-b.x,a.y-b.y);r0=view.r}
    tw=null;lastInter=performance.now();
  });
  el.addEventListener('pointermove',function(e){
    var p=ptrs[e.pointerId];if(!p)return;
    var ks=Object.keys(ptrs);
    if(ks.length===1){
      var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
      if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>7)tap.moved=true;
      view.th-=dx*0.006;view.ph=Math.max(0.3,Math.min(1.45,view.ph-dy*0.005));
    }else if(ks.length===2){
      p.x=e.clientX;p.y=e.clientY;var a=ptrs[ks[0]],b=ptrs[ks[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch0>0)view.r=Math.max(7,Math.min(48,r0*pinch0/d));
      if(tap)tap.moved=true;
    }
    lastInter=performance.now();
  });
  function up(e){
    var had=ptrs[e.pointerId];delete ptrs[e.pointerId];
    if(had&&tap&&!tap.moved&&performance.now()-tap.t<600&&Object.keys(ptrs).length===0)pick(e.clientX,e.clientY);
    tap=null;pinch0=0;
  }
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',function(e){delete ptrs[e.pointerId];tap=null});
  el.addEventListener('wheel',function(e){e.preventDefault();view.r=Math.max(7,Math.min(48,view.r*(1+e.deltaY*0.001)));tw=null;lastInter=performance.now()},{passive:false});
}

  if(chalOn){submit(tags);return}
  var s=PRIO.filter(function(t){return tags.indexOf(t)>=0})[0];
  if(s)go(TAGSTOP[s]);
}
function flash(tg){pulse={tag:tg,t0:performance.now()}}
function updatePulse(now){
  if(!pulse)return;
  var u=(now-pulse.t0)/1800,on=u<1&&Math.floor(u*6)%2===0;
  pickMeshes.forEach(function(m){
    if(m.userData.all.indexOf(pulse.tag)>=0&&m.material.emissive){m.material.emissive.setHex(on?0x887722:0x000000)}
  });
  if(u>=1)pulse=null;
}
function updateMarkers(){
  var w=window.innerWidth,h=window.innerHeight,show=!chalOn;
  mks.forEach(function(m){
    var v=m.v.clone().project(camera);
    var vis=v.z<1&&show&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;
    m.el.style.opacity=vis?1:0;m.el.style.pointerEvents=vis?'auto':'none';
    m.el.style.transform='translate('+((v.x*0.5+0.5)*w)+'px,'+((-v.y*0.5+0.5)*h)+'px)';
  });
}
function applyTheme(){
  if(!hasGL)return;
  var night=document.documentElement.getAttribute('data-theme')==='night';
  var c=night?0x1E2547:0xBFE3F2;scene.background.setHex(c);scene.fog.color.setHex(c);
  hemi.intensity=night?0.36:0.6;dl.intensity=night?0.2:0.42;dl.color.setHex(night?0x8FA2E0:0xFFFFFF);
  sea.material.color.setHex(night?0x2F4E8C:0x7EBBE0);
}
var last=0,tAcc=0;
function loop(now){
  requestAnimationFrame(loop);
  if(mode!=='3d'||!hasGL||window.__freeze)return;
  var dt=Math.min(0.05,(now-last)/1000||0.016);last=now;tAcc+=dt;
  if(tw){
    var u=Math.min(1,(now-tw.t0)/tw.dur),e=u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    ['tx','ty','tz','r','th','ph'].forEach(function(k){view[k]=tw.from[k]+(tw.to[k]-tw.from[k])*e});
    if(u>=1)tw=null;
  }else if(cur===0&&!chalOn&&!reduce&&now-lastInter>4000){view.th+=dt*0.07}
  if(!reduce)anims.forEach(function(f){f(tAcc)});
  rings.forEach(function(r,i){var u=((tAcc*0.12+i/3)%1);r.scale.set(1+u*0.5,1+u*0.5,1);r.material.opacity=0.5*(1-u)});
  applyCam();updatePulse(now);updateMarkers();tickChallenge();
  renderer.render(scene,camera);
}

/* ---------- start ---------- */
if(THREEok){try{hasGL=init3D()}catch(e){hasGL=false;try{console.error(e)}catch(_){}}}
if(hasGL){bindControls();applyTheme();new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}
render();
if(!hasGL){mode='2d';var n=document.createElement('p');n.className='sub';n.textContent=U.wgl;$('v2d').querySelector('.in').insertBefore(n,$('hint2d'))}
setMode(mode);
if(hasGL){onResize();flyTo(0,true);applyCam();requestAnimationFrame(loop)}
setInterval(function(){if(mode==='2d')tickChallenge()},200);
window.__farm={q:function(){return challenge&&challenge.qs[challenge.i]?challenge.qs[challenge.i][0]:null},where:function(t){camera.updateMatrixWorld();for(var i=0;i<pickMeshes.length;i++){var m=pickMeshes[i];if(m.userData.all.indexOf(t)>=0){var v=new THREE.Vector3();m.getWorldPosition(v);v.project(camera);var sx=(v.x*0.5+0.5)*window.innerWidth,sy=(-v.y*0.5+0.5)*window.innerHeight;var el=document.elementFromPoint(sx,sy);if(v.z<1&&el&&el.tagName==='CANVAS')return [sx,sy]}}return null},snap:function(){applyCam();renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png')},scene:function(){return scene},go:go,state:function(){return {mode:mode,hasGL:hasGL,cur:cur,chal:chalOn,pick:pickMeshes.length,meshes:renderer?renderer.info.render.triangles:0,view:view,cam:camera?camera.position.toArray():null,asp:camera?camera.aspect:0,sz:renderer?[renderer.domElement.width,renderer.domElement.height]:0}}};
})();
