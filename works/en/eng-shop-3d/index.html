  var c=challenge;if(!c||c.lock)return;
  var q=c.qs[c.i];

  c.lock=true;setTimeout(fitSheet,30);
  if(tags.indexOf(q[0])>=0){
    var pts=100+(c.timer?Math.round(50*Math.max(0,1-(performance.now()-c.t0)/1000/LIM)):0)+Math.min(50,c.streak*10);
    c.score+=pts;c.right++;c.streak++;

  if(f<=0){c.lock=true;c.streak=0;flash(c.qs[c.i][0]);$('cfb').textContent=U.timeup+'。'+U.shown;$('cfb').className='fb bad';c.i++;setTimeout(function(){if(challenge===c)askNext()},2000)}

  // markers
  MARK.forEach(function(m,i){
    if(!m)return;var b=document.createElement('button');b.type='button';b.className='mk';b.innerHTML=i+'<span>'+S[i].name+'</span>';
    b.addEventListener('click',function(e){e.stopPropagation();if(chalOn)return;go(i)});$('mks').appendChild(b);mks.push({el:b,stop:i,v:new THREE.Vector3(m[0],m[1],m[2])});
  });
  return true;
}
var dl;
function setOffset(){
  var w=window.innerWidth,h=window.innerHeight;
  var off=mode!=='3d'?0:(chalOn?-($('top').offsetHeight+8)*0.5:Math.min(sheetH,h*0.5)*0.5);
  camera.setViewOffset(w,h,0,off,w,h);
}
function onResize(){
  if(!hasGL)return;
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h);camera.aspect=w/h;
  camera.updateProjectionMatrix();setOffset();
  fitSheet();
}
window.addEventListener('resize',onResize);

function flyTo(i,instant){
  var v=VIEWS[i],to={tx:v.t[0],ty:v.t[1],tz:v.t[2],r:v.r,th:v.th,ph:v.ph};
  var asp=window.innerWidth/Math.max(1,window.innerHeight),fw=v.w||14;to.r=Math.max(v.r,fw/(2*Math.tan(camera.fov*Math.PI/360)*asp));
  if(instant||reduce){view=to;tw=null;return}
  var from={tx:view.tx,ty:view.ty,tz:view.tz,r:view.r,th:view.th,ph:view.ph};
  while(to.th-from.th>Math.PI)to.th-=2*Math.PI;while(to.th-from.th<-Math.PI)to.th+=2*Math.PI;
  tw={t0:performance.now(),dur:1000,from:from,to:to};
}
function applyCam(){
  var sp=Math.sin(view.ph),x=view.tx+view.r*sp*Math.sin(view.th),y=view.ty+view.r*Math.cos(view.ph),z=view.tz+view.r*sp*Math.cos(view.th);
  camera.position.set(x,y,z);camera.lookAt(view.tx,view.ty,view.tz);
}
// pointer controls
var ptrs={},tap=null,pinch0=0,r0=0;
function bindControls(){
  var el=renderer.domElement;
  el.addEventListener('pointerdown',function(e){
    el.setPointerCapture&&el.setPointerCapture(e.pointerId);
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    tap=Object.keys(ptrs).length===1?{x:e.clientX,y:e.clientY,t:performance.now(),moved:false}:null;
    if(Object.keys(ptrs).length===2){var k=Object.keys(ptrs),a=ptrs[k[0]],b=ptrs[k[1]];pinch0=Math.hypot(a.x-b.x,a.y-b.y);r0=view.r}
    tw=null;lastInter=performance.now();
  });
  el.addEventListener('pointermove',function(e){
    var p=ptrs[e.pointerId];if(!p)return;
    var ks=Object.keys(ptrs);
    if(ks.length===1){
      var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
      if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>7)tap.moved=true;
      view.th-=dx*0.006;view.ph=Math.max(0.3,Math.min(1.45,view.ph-dy*0.005));
    }else if(ks.length===2){
      p.x=e.clientX;p.y=e.clientY;var a=ptrs[ks[0]],b=ptrs[ks[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch0>0)view.r=Math.max(7,Math.min(48,r0*pinch0/d));
      if(tap)tap.moved=true;
    }
    lastInter=performance.now();
  });
  function up(e){
    var had=ptrs[e.pointerId];delete ptrs[e.pointerId];
    if(had&&tap&&!tap.moved&&performance.now()-tap.t<600&&Object.keys(ptrs).length===0)pick(e.clientX,e.clientY);
    tap=null;pinch0=0;
  }
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',function(e){delete ptrs[e.pointerId];tap=null});
  el.addEventListener('wheel',function(e){e.preventDefault();view.r=Math.max(7,Math.min(48,view.r*(1+e.deltaY*0.001)));tw=null;lastInter=performance.now()},{passive:false});
}
var ray;
function hitTags(cx,cy){
  ray=ray||new THREE.Raycaster();
  var nd=new THREE.Vector2(cx/window.innerWidth*2-1,-(cy/window.innerHeight)*2+1);
  ray.setFromCamera(nd,camera);
  var hits=ray.intersectObjects(scene.children,true);
  for(var i=0;i<hits.length;i++){var o=hits[i].object;if(o.userData.all&&o.userData.all.length)return o.userData.all;if(o===islandG||o.parent===islandG)break}
  return [];
}
function pick(cx,cy){
  var tags=hitTags(cx,cy);
  if(chalOn){submit(tags);return}
  var s=PRIO.filter(function(t){return tags.indexOf(t)>=0})[0];
  if(s)go(TAGSTOP[s]);
}
function flash(tg){pulse={tag:tg,t0:performance.now()}}
function updatePulse(now){
  if(!pulse)return;
  var u=(now-pulse.t0)/1800,on=u<1&&Math.floor(u*6)%2===0;
  pickMeshes.forEach(function(m){
    if(m.userData.all.indexOf(pulse.tag)>=0&&m.material.emissive){m.material.emissive.setHex(on?0x887722:0x000000)}
  });
  if(u>=1)pulse=null;
}
function updateMarkers(){
  var w=window.innerWidth,h=window.innerHeight,show=!chalOn;
  mks.forEach(function(m){
    var v=m.v.clone().project(camera);
    var vis=v.z<1&&show&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;
    m.el.style.opacity=vis?1:0;m.el.style.pointerEvents=vis?'auto':'none';
    m.el.style.transform='translate('+((v.x*0.5+0.5)*w)+'px,'+((-v.y*0.5+0.5)*h)+'px)';
  });
}
function applyTheme(){
  if(!hasGL)return;
  var night=document.documentElement.getAttribute('data-theme')==='night';
  var c=night?0x1E2547:0xBFE3F2;scene.background.setHex(c);scene.fog.color.setHex(c);
  hemi.intensity=night?0.36:0.6;dl.intensity=night?0.2:0.42;dl.color.setHex(night?0x8FA2E0:0xFFFFFF);
  sea.material.color.setHex(night?0x2F4E8C:0x7EBBE0);
}
var last=0,tAcc=0;
function loop(now){
  requestAnimationFrame(loop);
  if(mode!=='3d'||!hasGL||window.__freeze)return;
  var dt=Math.min(0.05,(now-last)/1000||0.016);last=now;tAcc+=dt;
  if(tw){
    var u=Math.min(1,(now-tw.t0)/tw.dur),e=u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    ['tx','ty','tz','r','th','ph'].forEach(function(k){view[k]=tw.from[k]+(tw.to[k]-tw.from[k])*e});
    if(u>=1)tw=null;
  }else if(cur===0&&!chalOn&&!reduce&&now-lastInter>4000){view.th+=dt*0.07}
  if(!reduce)anims.forEach(function(f){f(tAcc)});
  rings.forEach(function(r,i){var u=((tAcc*0.12+i/3)%1);r.scale.set(1+u*0.5,1+u*0.5,1);r.material.opacity=0.5*(1-u)});
  applyCam();updatePulse(now);updateMarkers();tickChallenge();
  renderer.render(scene,camera);
}

/* ---------- start ---------- */
if(THREEok){try{hasGL=init3D()}catch(e){hasGL=false;try{console.error(e)}catch(_){}}}
if(hasGL){bindControls();applyTheme();new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}
render();
if(!hasGL){mode='2d';var n=document.createElement('p');n.className='sub';n.textContent=U.wgl;$('v2d').querySelector('.in').insertBefore(n,$('hint2d'))}
setMode(mode);
if(hasGL){onResize();flyTo(0,true);applyCam();requestAnimationFrame(loop)}
setInterval(function(){if(mode==='2d')tickChallenge()},200);
window.__farm={tags:function(){return {prio:PRIO,tagstop:TAGSTOP}},tile:function(t){tilePick(t)},q:function(){return challenge&&challenge.qs[challenge.i]?challenge.qs[challenge.i][0]:null},where:function(t){camera.updateMatrixWorld();for(var i=0;i<pickMeshes.length;i++){var m=pickMeshes[i];if(m.userData.all.indexOf(t)>=0){var v=new THREE.Vector3();m.getWorldPosition(v);v.project(camera);var sx=(v.x*0.5+0.5)*window.innerWidth,sy=(-v.y*0.5+0.5)*window.innerHeight;var el=document.elementFromPoint(sx,sy);if(v.z<1&&el&&el.tagName==='CANVAS'&&hitTags(sx,sy).indexOf(t)>=0)return [sx,sy]}}return null},snap:function(){applyCam();renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png')},scene:function(){return scene},go:go,state:function(){return {mode:mode,hasGL:hasGL,cur:cur,chal:chalOn,pick:pickMeshes.length,meshes:renderer?renderer.info.render.triangles:0,view:view,cam:camera?camera.position.toArray():null,asp:camera?camera.aspect:0,sz:renderer?[renderer.domElement.width,renderer.domElement.height]:0}}};
})();
</script>
